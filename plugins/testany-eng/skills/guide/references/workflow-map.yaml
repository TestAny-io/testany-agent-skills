version: 2
notes:
  - "Guardrails is cross-cutting, not a default mainline gate."
  - "Prototype is optional and only shown when repo or user intent justifies it."
  - "Code Review is an implementation gate after an exact Candidate exists; it is parallel to test-document preparation and does not imply deployment approval."
  - "Testany automation landing is optional and only shown when user intent or an approved Test Spec handoff justifies it."
  - "Commands in the automation lane come from the sibling testany-bot plugin and are valid canonical commands for cross-plugin routing."
  - "Use artifact-detection.md for detailed recognition and confidence rules."
  - "Formal mainline prerequisites do not apply automatically to bounded repairs. Apply review_routing first."
  - "Review approval, scope authorization and external execution permission are distinct; follow ../../../references/review-boundaries.md."

# Declarative routing guidance, not an automatic hook or a new product gate.
review_routing:
  shared_reference: ../../../references/review-boundaries.md
  first_classify: [user_objective, artifact_or_candidate, decision_layer, approved_scope_source]
  modes: [formal_design, bounded_change]
  bounded_alias: amendment
  document_amendments_reference: ../../../references/document-amendments.md
  rules:
    - when: exact_implementation_review
      command: /code-reviewer
      constraints: "Use existing Candidate and policy rules; do not sign a code verdict for a plan."
    - when: approved_boundary_implementation_plan
      command: /lld-reviewer
      mode: bounded_change
      constraints: "Methods, SQL, transactions, retries or config; no full Manifest required just for a repair."
    - when: responsibility_trust_dependency_or_failure_boundary_change
      command: /hld-reviewer
      mode: bounded_change
      constraints: "Review only the architecture increment; verify scope authority separately from technical merit."
    - when: contract_wire_identity_permission_or_compatibility_change
      command: /api-reviewer
      mode: bounded_change
      constraints: "Affected contract only; design/code comments do not approve new wire."
    - when: authorized_existing_contract_amendment
      command: /api-writer
      mode: bounded_change
      constraints: "Use existing contract and authorized change; preserve unaffected behavior, no full historical PRD/HLD backfill."
    - when: formal_design_submission
      constraints: "Use the corresponding HLD/LLD artifact route and full applicable coverage."
    - when: mixed_request
      constraints: "Split by decision layer; continue independent bounded parts; do not upgrade the whole request."
  owner_decisions:
    product: "Changed user/business behavior, permission population, support, charging or data disposition."
    engineering: "Architecture changes only within explicitly delegated authority; ask user to identify owner if unknown."
  non_triggers: [cross_repository_count, line_count, lead_dev_title, security_keyword, technical_plan_filename]

states:
  - missing
  - draft
  - in_review
  - approved
  - unknown

scan:
  priority_dirs:
    - .
    - docs
    - doc
    - spec
    - design
    - workflow
    - test
    - tests
  file_types:
    - md
    - yaml
    - yml
    - json
    - proto
    - graphql
    - gql
  evidence_order:
    - traceability_metadata
    - inline_status
    - review_certificate
    - review_report
    - filename_or_title_heuristic

lanes:
  - id: main
    title: 主流程
  - id: prototype
    title: 可选 Prototype 分支
  - id: automation
    title: 可选 Testany 自动化落地分支
  - id: implementation
    title: 实现与 Code Review 分支
  - id: guardrails
    title: 横切 Guardrails 分支

artifacts:
  - id: BRD
    filename_keywords: [brd]
  - id: USER_JOURNEY
    filename_keywords: [journey, user-journey, user_journey, uc]
  - id: PRD
    metadata_types: [PRD]
    filename_keywords: [prd]
  - id: API_CONTRACT
    filename_keywords: [openapi, swagger, asyncapi, api-contract, api_contract, contract, graphql, schema, proto]
  - id: HLD
    metadata_types: [HLD]
    filename_keywords: [hld]
  - id: TEST_STRATEGY
    metadata_types: [TEST_STRATEGY]
    filename_keywords: [test-strategy, test_strategy, strategy]
  - id: LLD
    metadata_types: [LLD]
    filename_keywords: [lld]
  - id: TEST_SPEC
    metadata_types: [TEST_SPEC]
    filename_keywords: [test-spec, test_spec, test-package, test_package]
  - id: IMPLEMENTATION_CANDIDATE
    evidence_kinds: [explicit_git_candidate, review_request, code_review_report, code_review_certificate]
    filename_keywords: [code-review, code_review, review-request, review_request, exec-plan, exec_plan]
  - id: RUNBOOK
    filename_keywords: [runbook]
  - id: PROTOTYPE
    filename_keywords: [_prototype-manifest, prototype]
  - id: GUARDRAILS
    filename_keywords: [guardrails, engineering-standards, engineering_standards]

artifact_routes:
  - artifact: BRD
    creation_node: brd-interviewer
    creation_command: /brd-interviewer
  - artifact: USER_JOURNEY
    creation_node: uc-interviewer
    creation_command: /uc-interviewer
    do_not_suggest: [/user-journey, /journey, /user-journey-interviewer]
  - artifact: PRD
    creation_node: prd-writer
    creation_command: /prd-writer
    review_node: prd-reviewer
    review_command: /prd-reviewer
  - artifact: API_CONTRACT
    creation_node: api-writer
    creation_command: /api-writer
    review_node: api-reviewer
    review_command: /api-reviewer
  - artifact: HLD
    creation_node: hld-writer
    creation_command: /hld-writer
    review_node: hld-reviewer
    review_command: /hld-reviewer
  - artifact: TEST_STRATEGY
    creation_node: test-strategy-writer
    creation_command: /test-strategy-writer
    review_node: test-strategy-reviewer
    review_command: /test-strategy-reviewer
  - artifact: LLD
    creation_node: lld-writer
    creation_command: /lld-writer
    review_node: lld-reviewer
    review_command: /lld-reviewer
  - artifact: TEST_SPEC
    creation_node: test-spec-writer
    creation_command: /test-spec-writer
    review_node: test-reviewer
    review_command: /test-reviewer
  - artifact: IMPLEMENTATION_CANDIDATE
    review_node: code-reviewer
    review_command: /code-reviewer
  - artifact: RUNBOOK
    creation_node: runbook-writer
    creation_command: /runbook-writer
  - artifact: PROTOTYPE
    creation_node: prototype-designer
    creation_command: /prototype-designer
    review_node: prototype-reviewer
    review_command: /prototype-reviewer
  - artifact: GUARDRAILS
    creation_node: guardrails-writer
    creation_command: /guardrails-writer
    review_node: guardrails-reviewer
    review_command: /guardrails-reviewer

nodes:
  - id: brd-interviewer
    lane: main
    kind: interviewer
    command: /brd-interviewer
    produces: BRD
    next: [uc-interviewer]

  - id: uc-interviewer
    lane: main
    kind: interviewer
    command: /uc-interviewer
    requires:
      - BRD: approved_or_exists
    produces: USER_JOURNEY
    next: [prd-writer]

  - id: prd-writer
    lane: main
    kind: writer
    command: /prd-writer
    requires:
      - BRD: approved_or_exists
      - USER_JOURNEY: preferred
    requires_apply_to: formal_design
    bounded_inputs: [existing_artifact, scoped_change_request, relevant_approved_baseline_or_owner_decision]
    bounded_next: affected_artifact_only
    produces: PRD
    next: [prd-reviewer]

  - id: prd-reviewer
    lane: main
    kind: reviewer
    command: /prd-reviewer
    requires:
      - PRD: exists
    requires_apply_to: formal_design
    bounded_inputs: [existing_artifact, scoped_change_request, relevant_approved_baseline_or_owner_decision]
    bounded_next: affected_artifact_only
    approves: PRD
    next: [api-writer]

  - id: prototype-designer
    lane: prototype
    kind: writer
    command: /prototype-designer
    requires:
      - PRD: approved
      - USER_JOURNEY: exists
    produces: PROTOTYPE
    show_when:
      - frontend_repo
      - explicit_ui_validation
    next: [prototype-reviewer]

  - id: prototype-reviewer
    lane: prototype
    kind: reviewer
    command: /prototype-reviewer
    requires:
      - PROTOTYPE: exists
      - PRD: approved
      - USER_JOURNEY: exists
    approves: PROTOTYPE
    next: [api-writer]

  - id: api-writer
    lane: main
    kind: writer
    command: /api-writer
    requires:
      - PRD: approved
    requires_apply_to: formal_design
    bounded_inputs: [existing_artifact, scoped_change_request, relevant_approved_baseline_or_owner_decision]
    bounded_next: affected_artifact_only
    produces: API_CONTRACT
    next: [api-reviewer]

  - id: api-reviewer
    lane: main
    kind: reviewer
    command: /api-reviewer
    requires:
      - API_CONTRACT: exists
      - PRD: preferred
    requires_apply_to: formal_design
    bounded_inputs: [existing_artifact, scoped_change_request, relevant_approved_baseline_or_owner_decision]
    bounded_next: affected_artifact_only
    approves: API_CONTRACT
    next: [hld-writer]

  - id: hld-writer
    lane: main
    kind: writer
    command: /hld-writer
    requires:
      - PRD: approved
      - API_CONTRACT: approved
    requires_apply_to: formal_design
    bounded_inputs: [existing_artifact, scoped_change_request, relevant_approved_baseline_or_owner_decision]
    bounded_next: affected_artifact_only
    produces: HLD
    next: [hld-reviewer]

  - id: hld-reviewer
    lane: main
    kind: reviewer
    command: /hld-reviewer
    requires:
      - HLD: exists
      - PRD: approved
      - API_CONTRACT: preferred
    requires_apply_to: formal_design
    bounded_inputs: [architecture_change_request, relevant_approved_baseline_or_owner_decision]
    approves: HLD
    next: [test-strategy-writer]

  - id: test-strategy-writer
    lane: main
    kind: writer
    command: /test-strategy-writer
    requires:
      - PRD: approved
      - API_CONTRACT: approved
      - HLD: approved
      - GUARDRAILS: optional
    requires_apply_to: formal_design
    bounded_inputs: [existing_artifact, scoped_change_request, relevant_approved_baseline_or_owner_decision]
    bounded_next: affected_artifact_only
    produces: TEST_STRATEGY
    next: [test-strategy-reviewer]

  - id: test-strategy-reviewer
    lane: main
    kind: reviewer
    command: /test-strategy-reviewer
    requires:
      - TEST_STRATEGY: exists
      - PRD: preferred
      - API_CONTRACT: preferred
      - HLD: preferred
    requires_apply_to: formal_design
    bounded_inputs: [existing_artifact, scoped_change_request, relevant_approved_baseline_or_owner_decision]
    bounded_next: affected_artifact_only
    approves: TEST_STRATEGY
    next: [lld-writer]

  - id: lld-writer
    lane: main
    kind: writer
    command: /lld-writer
    requires:
      - PRD: approved
      - API_CONTRACT: approved
      - HLD: approved
      - TEST_STRATEGY: approved
      - GUARDRAILS: optional
    requires_apply_to: formal_design
    bounded_inputs: [existing_artifact, scoped_change_request, relevant_approved_baseline_or_owner_decision]
    bounded_next: affected_artifact_only
    produces: LLD
    next: [lld-reviewer]

  - id: lld-reviewer
    lane: main
    kind: reviewer
    command: /lld-reviewer
    requires:
      - LLD: exists
      - PRD: approved
      - HLD: approved
      - API_CONTRACT: preferred
      - GUARDRAILS: optional
    requires_apply_to: formal_design
    bounded_inputs: [engineering_repair_plan, relevant_approved_baseline_or_owner_decision]
    approves: LLD
    next: [test-spec-writer, code-reviewer]

  - id: code-reviewer
    lane: implementation
    kind: reviewer
    command: /code-reviewer
    requires:
      - IMPLEMENTATION_CANDIDATE: exists
      - PRD: preferred
      - API_CONTRACT: preferred
      - HLD: preferred
      - LLD: preferred
      - GUARDRAILS: optional
    approves: IMPLEMENTATION_CANDIDATE
    next: []

  - id: test-spec-writer
    lane: main
    kind: writer
    command: /test-spec-writer
    requires:
      - PRD: approved
      - API_CONTRACT: approved
      - HLD: approved
      - LLD: approved
      - TEST_STRATEGY: approved
      - GUARDRAILS: optional
    requires_apply_to: formal_design
    bounded_inputs: [existing_artifact, scoped_change_request, relevant_approved_baseline_or_owner_decision]
    bounded_next: affected_artifact_only
    produces: TEST_SPEC
    next: [test-reviewer]

  - id: test-reviewer
    lane: main
    kind: reviewer
    command: /test-reviewer
    requires:
      - TEST_SPEC: exists
      - TEST_STRATEGY: preferred
    requires_apply_to: formal_design
    bounded_inputs: [existing_artifact, scoped_change_request, relevant_approved_baseline_or_owner_decision]
    bounded_next: affected_artifact_only
    approves: TEST_SPEC
    next: [runbook-writer, case-writing]

  - id: runbook-writer
    lane: main
    kind: writer
    command: /runbook-writer
    requires:
      - HLD: approved
      - LLD: preferred
      - TEST_SPEC: preferred
      - GUARDRAILS: optional
    requires_apply_to: formal_design
    bounded_inputs: [existing_artifact, scoped_change_request, relevant_approved_baseline_or_owner_decision]
    bounded_next: affected_artifact_only
    produces: RUNBOOK
    next: []

  - id: case-writing
    lane: automation
    plugin: testany-bot
    kind: writer
    command: /case-writing
    requires:
      - TEST_SPEC: approved
    show_when:
      - explicit_testany_automation
      - testany_automation_handoff_ready
      - testany_automation_handoff_partial
    produces: TESTANY_PLATFORM_CASE_PACKAGE
    next: [case]

  - id: case
    lane: automation
    plugin: testany-bot
    kind: operator
    command: /case
    requires:
      - TEST_SPEC: preferred
    show_when:
      - testany_platform_case_packages_ready
    produces: TESTANY_REGISTERED_CASE
    next: [pipeline]

  - id: pipeline
    lane: automation
    plugin: testany-bot
    kind: operator
    command: /pipeline
    requires:
      - TEST_SPEC: preferred
    show_when:
      - testany_registered_cases_ready
    produces: TESTANY_PIPELINE
    next: [trigger]

  - id: trigger
    lane: automation
    plugin: testany-bot
    kind: operator
    command: /trigger
    requires: []
    show_when:
      - testany_pipeline_ready
    produces: TESTANY_TRIGGER
    next: [execution]

  - id: execution
    lane: automation
    plugin: testany-bot
    kind: operator
    command: /execution
    requires: []
    show_when:
      - testany_execution_exists
    produces: TESTANY_EXECUTION
    next: []

  - id: guardrails-writer
    lane: guardrails
    kind: writer
    command: /guardrails-writer
    requires: []
    produces: GUARDRAILS
    show_when:
      - new_project_without_guardrails
      - architecture_or_platform_change
      - compliance_change
      - repeated_review_findings
      - incident_postmortem
    next: [guardrails-reviewer]

  - id: guardrails-reviewer
    lane: guardrails
    kind: reviewer
    command: /guardrails-reviewer
    requires:
      - GUARDRAILS: exists
    approves: GUARDRAILS
    next: []
