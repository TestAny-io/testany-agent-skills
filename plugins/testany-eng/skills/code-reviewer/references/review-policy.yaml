version: 3
skill: code-reviewer
# 规则索引；按触发查阅，不是每轮必须展开的报告 schema。
reading:
  entry: ONCE_PER_SESSION_OR_VERSION_CHANGE
  initial: [applicable_checklist_sections, scope_template, report_template]
  followup: [latest_valid_summary, open_items, candidate_delta, affected_evidence]
  machine_manifests: SCRIPT_VERIFY_AND_SUMMARIZE
  unchanged_verified_artifact: REUSE_CACHED_VERIFICATION
  author_summary_replaces_primary_evidence: false
  recursive_history_replay_required: false

review_modes:
  initial_full_review:
    when: NO_TRUSTED_COMPLETE_COVERAGE_OR_IMPACT_CANNOT_BE_BOUNDED
    coverage: ENTIRE_IN_SCOPE_DIFF_REUSING_TRUSTED_COMPLETED_PARTS
  remediation_delta_review:
    when: REAL_CANDIDATE_DELTA_WITH_TRUSTED_PRIOR_COVERAGE
    coverage: PRIOR_BLOCKERS_DELTA_DIRECT_CONSUMERS_AND_SHARED_DEPENDENCIES
  focused_recovery_review:
    when: REVIEWER_MISS_INVALID_CLOSURE_OR_NEW_CI_ENV_EVIDENCE
    coverage: INVALIDATED_INVARIANTS_ROOT_CAUSE_SIBLING_PATHS_AND_RECOVERY
    preserve_unaffected_coverage: true
  binding_only:
    when: VALID_SOURCE_APPROVAL_AND_PROVEN_IDENTICAL_CONTENT_AND_CONTEXT
    semantic_review: false
    new_review_id: false
    new_test_run_by_default: false
    output: BINDING_RECEIPT_REFERENCING_VALID_SOURCE_APPROVAL

review_selection:
  facts_not_round_or_miss_count: true
  repeated_miss_automatically_blocks_process: false
  miss_automatically_requires_new_main: false
  review_reset_requires_pm_approval: false
  full_review_requires_concrete_reason:
    - missing_or_untrustworthy_initial_coverage
    - impact_cannot_be_isolated
    - shared_baseline_or_oracle_invalidates_all_coverage
    - explicit_user_full_review_request
  new_ci_or_environment_log_alone_requires_full_review: false
  partial_prior_coverage: COMPLETE_GAPS_AND_AFFECTED_RANGES
  legacy_exception_history: READ_RELEVANT_FACTS_WITHOUT_COUNT_BASED_ESCALATION
  newer_blocker_or_withdrawal_overrides_older_approval: true

verdicts: [APPROVED, CHANGES_REQUIRED, SCOPE_DECISION_REQUIRED, EVIDENCE_BLOCKED]
conditional_pass_allowed: false
decision_precedence: [EVIDENCE_BLOCKED, SCOPE_DECISION_REQUIRED, CHANGES_REQUIRED, APPROVED]

candidate_binding:
  immutable_commit:
    require: [exact_commit, exact_tree, exact_base_and_range, changed_path_manifest]
    no_replace_refs_or_legacy_grafts: true
    git_no_replace_objects: true
    external_diff_and_textconv: false
    retain_submodule_differences: true
  mutable_worktree:
    tool: scripts/snapshot_worktree.py
    schema: testany.code-reviewer.worktree-snapshot.v1
    consecutive_capture_count: 2
    bind_raw_bytes_modes_index_submodules_untracked: true
    allow_hidden_index_flags: false
    allow_dirty_submodules: false
    allow_symlink_baselines: false
    excluded_wip_may_hide_committed_candidate: false
    candidate_owned_ignored_requires_explicit_capture: true
    save_exact_argv_and_full_json: true
    recheck: ONCE_AFTER_LAST_VALIDATION_IMMEDIATELY_BEFORE_VERDICT
    extra_recheck_when: INTERVENING_WRITE_OR_NEW_VALIDATION_OR_DRIFT
    read_only_ack_requires_recheck: false
    drift: INVALIDATE_BINDING_REVIEW_DELTA_REUSE_UNAFFECTED_EVIDENCE
    unstable_candidate: EVIDENCE_BLOCKED
  binding_only:
    tool: scripts/verify_candidate_binding.py
    receipt_is_approval: false
    require:
      - valid_prior_source_approved_with_complete_coverage_and_no_open_blockers
      - prior_artifact_and_snapshot_digest_pinned_by_reviewer
      - same_scope_lock_repository_identity_and_review_root_base
      - identical_entire_candidate_raw_bytes_paths_modes_and_gitlinks
      - mutable_baselines_unchanged
      - commands_configuration_toolchain_fixtures_and_oracles_unchanged
      - no_newer_blocker_withdrawal_or_semantic_requirement_change
    commit_sensitive_tests: INVALIDATE_WHEN_COMMIT_METADATA_IS_AN_INPUT
    unsupported_or_different: REVIEW_ACTUAL_DELTA_OR_RESTORE_SMALLEST_MISSING_PROOF
    ci_transfer_between_shas: false
    environment_or_deployment_approval_transfer: false

review_record:
  single_authoritative_record: true
  allowed: [embedded, readable_versioned_artifact]
  required: [review_id, reviewer, mode, scope_lock, repositories, coverage, blocking_items, evidence_refs, source_verdict]
  machine_appendices: [candidate_manifests, raw_command_output, binding_receipts]
  report_full_copy_of_appendices: false
  verify_version_and_digest_on_first_use_or_change: true
  relevant_primary_evidence_must_be_read: true
  binding_revision_without_semantic_review: true
  empty_conditional_appendices_required: false
  legacy_read_compatibility: true

scope_lock_binding:
  tool: scripts/scope_lock_digest.py
  schema: testany.code-reviewer.scope-lock.v1
  canonical_payload_required: true
  digest_is_authorization: false
  normal_remediation_changes_semantic_scope: false
  original_authorized_decision_required: true
  unknown_values: [NOT_BOUND, NOT_FROZEN]

severity:
  P0: {blocks_approval: true, evidence_required: true}
  P1: {blocks_approval: true, evidence_required: true}
  P2: {blocks_approval: false, count_threshold: null}

scope:
  baseline_driven: true
  unlisted_architecture_surface_authorized: false
  author_claim_or_old_reviewer_comment_is_approval: false
  semantic_trust_ownership_dependency_changes_are_surfaces: true
  candidate_out_of_budget_delta:
    boundary_preserving_revert_available: P1_SCOPE_VIOLATION
    minimum_fix: REVERT_OR_DELETE_UNAPPROVED_DELTA
    offer_expansion_instead_of_revert: false
  scope_decision_required_when: [approved_baseline_ambiguous_or_conflicting, minimum_correct_fix_requires_unapproved_surface]
  independent_in_scope_review_continues: true
  complexity_boundary:
    evaluate_manual_steps_gates_configuration_approvals_and_maintenance: true
    prefer_narrowing_false_claim_over_building_proof_infrastructure: true
    weakening_approved_requirements_allowed: false
    new_complexity_scoring_gate_required: false

optional_work:
  mandatory_remediation_contains_only_confirmed_p0_p1: true
  p2_requires_explicit_selection_to_become_requested_work: true
  selected_p2_automatically_becomes_blocking: false
  unselected_p2_enters_next_round_blocking_closure: false
  bundled_suggestion_to_close_all_p2_this_round_allowed: false

finding:
  required: [finding_id, severity, scope_classification, provenance, violated_frozen_invariant, exact_evidence, reproducer_or_failure_path, impact, minimum_boundary_preserving_fix, architecture_surface_delta]
  scope_classification: [in_scope, scope_violation]
  provenance: [initial_review, remediation_delta, previously_unavailable_evidence, reviewer_miss, post_terminal_new_ci_env]
  provenance_controls_scope_automatically: false
  conditional_fields:
    within_budget_surface: approved_budget_reference
    restored_missing_evidence: prior_eb_and_restored_source
    reviewer_miss: old_candidate_visibility_invalidated_closure_and_changed_validation_method
  causal_classes: [original_unfixed, introduced_by_fix, pre_existing_unreported_cause]
  stable_id_and_original_acceptance_required: true
  same_open_issue_additional_cause_is_automatically_new_miss: false
  missing_evidence_is_automatically_p1: false

scope_proposal:
  required: [proposal_id, conflicting_or_missing_approval, affected_range, smallest_owner_question]
  reviewer_can_approve_expansion: false
  proposed_future_work_alone_blocks_current_candidate: false

evidence_blocker:
  required: [blocker_id, missing_input, affected_range_or_invariant, smallest_restoration_evidence]
  kinds: [candidate_binding, approved_baseline, source_access, verification_evidence]
  repeated_miss_is_itself_evidence_blocker: false
  unaffected_work_is_preserved: true

production_evidence:
  require_for_touched_critical_paths:
    - frozen_invariant
    - production_entry_provider_parser_and_configuration
    - actual_helper_and_explicit_substitution_boundary
    - independent_oracle_and_source
    - legal_illegal_and_failure_outcomes
    - direct_consumers_branches_targets_and_retry_recovery
  real_dependency_alone_proves_real_production_input: false
  implementation_generated_expected_value_is_independent_oracle: false
  static_string_order_or_test_name_proves_behavior: false
  mock_of_reviewed_logic_proves_behavior: false
  management_compiler_must_express_required_runtime_input_when_touched: true
  new_hypothesis_requires_invariant_and_locatable_path: true
  per_file_matrix_or_new_proof_platform_required: false

behavior_closure:
  fix_one_line_is_sufficient: false
  inspect_direct_consumers_and_shared_dependencies: true
  stateful_failure_requires_relevant_consecutive_attempts: true
  ordinary_and_continuation_branches_checked_when_affected: true

evidence_reuse:
  require: [verified_prior_result, exact_content_binding, same_invariant_and_oracle, unaffected_or_reviewed_dependency_delta, equivalent_command_config_toolchain_fixture]
  author_pass_without_primary_evidence_sufficient: false
  trusted_complete_coverage_reusable: true
  invalidated_coverage_reusable: false
  unknown_dependency: RUN_SMALLEST_DISCRIMINATING_CHECK
  live_evidence_transfer: false
  exact_sha_ci_transfer: false
  source_approval_carry: ONLY_BINDING_ONLY_REQUIREMENTS

validation_ownership:
  expensive_equivalent_run_owner: ONE_WRITER_OR_CI_EXECUTOR
  reviewer_default: VERIFY_EVIDENCE_AND_RUN_MINIMAL_INDEPENDENT_PROBES
  rerun_triggers: [relevant_inputs_changed, result_missing_or_untrustworthy, specific_invariant_not_covered]
  concurrent_duplicate_run_allowed: false
  check_actual_ci_entry_and_configuration_early: true
  repeated_green_gate_without_new_fact_required: false

review_independence:
  reconstruct_path_before_reading_author_conclusion: true
  changed_method_required_for_invalidated_evidence: true
  new_agent_identity_alone_is_independence: false
  entire_review_must_be_repeated_by_main: false

multi_repository_review:
  shared_scope_and_exact_per_repo_bindings: true
  main_computes_machine_manifest_once_per_binding: true
  child_reads_own_assignment_and_needed_evidence: true
  assignment_scopes_must_not_silently_overlap_or_leave_gaps: true
  mixed_mutable_is_immutable_certificate: false
  all_repos_must_satisfy_binding_receipt_requirements: true

coverage:
  first_review_all_in_scope_changed_paths: true
  paths_include_modes_submodules_untracked_and_candidate_ignored: true
  changed_path_classifications: [in_scope, scope_violation, verified_filtered_baseline]
  filtered_baseline_requires: ONLY_RAW_WORKTREE_VS_INDEX_CHANGE_AND_FILTER_EOL_AND_PRIOR_RAW_PROOF
  mode_or_submodule_change_can_be_filtered: false
  required_gap_sets: [unclassified, scope_decision_blocked_ranges, evidence_or_assignment_gaps]
  scope_gap_requires: SD_REFERENCE
  evidence_or_assignment_gap_requires: EB_REFERENCE
  path_coverage_replaces_behavior_evidence: false
  delta_reuses_trusted_coverage_and_completes_affected_range: true

coordination:
  events: [candidate_ready, substantive_findings, blocker_change, final_verdict]
  reply_to_ack_required: false
  unchanged_status_message_or_new_review_turn_required: false
  wait: CURSOR_BASED_BOUNDED_WAIT_WITH_BACKOFF
  forward_full_record_on_every_handoff: false

approval_stop_condition:
  all_required: [p0_p1_zero, prior_blockers_closed, no_open_sd_or_eb, necessary_source_evidence_complete, candidate_stable, trusted_complete_coverage, all_gap_sets_empty]
  p2_ci_not_run_or_environment_pending_blocks_source: false
  approval_grants_external_action_permission: false
  continue_after_conditions_met: false

skill_behavior_validation:
  mechanical_regressions: [snapshot, scope_lock, terminal_envelope, candidate_binding, policy, behavior_cases]
  independent_blind_review: true
  minimum_cases: [one_of_CRB_001_003_005, CRB_008, paired_r2_delta]
  optimization_cases: [bounded_repeated_miss, identical_content_rebinding, relevant_change_invalidates_reuse]
  judge: [misses, false_positives, scope, convergence, unnecessary_work]
